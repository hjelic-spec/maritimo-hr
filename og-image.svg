<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2e40"/>
      <stop offset="100%" stop-color="#2c4f6e"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a9ece" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#6bb8e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4a9ece" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Waves -->
  <path d="M0 420 Q150 380 300 420 T600 420 T900 420 T1200 420 V630 H0Z" fill="url(#wave)"/>
  <path d="M0 460 Q150 430 300 460 T600 460 T900 460 T1200 460 V630 H0Z" fill="url(#wave)" opacity="0.6"/>
  <path d="M0 500 Q150 475 300 500 T600 500 T900 500 T1200 500 V630 H0Z" fill="url(#wave)" opacity="0.4"/>
  <!-- Anchor -->
  <text x="600" y="240" text-anchor="middle" font-size="120" fill="white" opacity="0.9">⚓</text>
  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="72" fill="white" letter-spacing="2">Maritimo</text>
  <!-- Subtitle -->
  <text x="600" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="28" fill="#a0c4e0">Pomorska prognoza za Jadran</text>
  <!-- Features -->
  <text x="600" y="560" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" fill="#7fb3d4">Vjetar · Valovi · Temperature mora · Meteogram · DHMZ upozorenja</text>
</svg>
